<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="brass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4a520"/>
      <stop offset="50%" stop-color="#b8860b"/>
      <stop offset="100%" stop-color="#8b6914"/>
    </linearGradient>
  </defs>
  
  <!-- Parchment background -->
  <rect width="100" height="100" rx="16" fill="#f5f0e6"/>
  
  <!-- Outer gear/cog ring -->
  <circle cx="50" cy="50" r="38" fill="none" stroke="url(#brass)" stroke-width="3"/>
  <circle cx="50" cy="50" r="32" fill="none" stroke="url(#brass)" stroke-width="1" opacity="0.4"/>
  
  <!-- Gear teeth -->
  <g stroke="url(#brass)" stroke-width="3" stroke-linecap="round">
    <line x1="50" y1="8" x2="50" y2="14"/>
    <line x1="50" y1="86" x2="50" y2="92"/>
    <line x1="8" y1="50" x2="14" y2="50"/>
    <line x1="86" y1="50" x2="92" y2="50"/>
    <line x1="20" y1="20" x2="24" y2="24"/>
    <line x1="76" y1="76" x2="80" y2="80"/>
    <line x1="80" y1="20" x2="76" y2="24"/>
    <line x1="24" y1="76" x2="20" y2="80"/>
  </g>
  
  <!-- Central crystal/eye -->
  <ellipse cx="50" cy="50" rx="14" ry="18" fill="url(#brass)" opacity="0.15"/>
  <ellipse cx="50" cy="50" rx="8" ry="12" fill="url(#brass)"/>
  <ellipse cx="50" cy="46" rx="3" ry="5" fill="#f5f0e6" opacity="0.6"/>
  
  <!-- Arcane sparks -->
  <circle cx="38" cy="38" r="1.5" fill="#b87333"/>
  <circle cx="64" cy="42" r="1" fill="#b87333"/>
  <circle cx="42" cy="64" r="1.2" fill="#b87333"/>
</svg>